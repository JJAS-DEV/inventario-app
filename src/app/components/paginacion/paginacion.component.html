@if(paginator.page.totalPages > 1){

<ul class="pagination">

    <!-- Primera página -->
    <li class="page-item">
        <a class="page-link" [routerLink]="[url + '/0'+'/size/'+paginator.page.size]">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" 
                 class="bi bi-chevron-double-left" viewBox="0 0 16 16">
              <path fill-rule="evenodd" d="M8.354 1.646a.5.5 0 0 1 0 .708L2.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0"/>
              <path fill-rule="evenodd" d="M12.354 1.646a.5.5 0 0 1 0 .708L6.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0"/>
            </svg>
        </a>
    </li>

    <!-- Atrás -->
    @if(paginator.page.number > 0){
        <li class="page-item">
            <a class="page-link" [routerLink]="[url + '/'+ (paginator.page.number - 1)+'/size/'+paginator.page.size]">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" 
                     class="bi bi-chevron-compact-left" viewBox="0 0 16 16">
                  <path fill-rule="evenodd" d="M9.224 1.553a.5.5 0 0 1 .223.67L6.56 8l2.888 5.776a.5.5 0 1 1-.894.448l-3-6a.5.5 0 0 1 0-.448l3-6a.5.5 0 0 1 .67-.223"/>
                </svg>
            </a>
        </li>
    }


    @for (pagina of visiblePages; track pagina) {
  <li class="page-item" [class.active]="pagina === paginator.page.number">
    <a
      class="page-link"
      [routerLink]="[url + '/' + pagina + '/size/' + paginator.page.size]"
    >
      {{ pagina + 1 }}
    </a>
  </li>
}

    <!-- Siguiente -->
    @if(paginator.page.number < paginator.page.totalPages - 1){
        <li class="page-item">
            <a class="page-link" [routerLink]="[url + '/'+ (paginator.page.number + 1)+'/size/'+size]">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" 
                     class="bi bi-chevron-compact-right" viewBox="0 0 16 16">
                  <path fill-rule="evenodd" d="M6.776 1.553a.5.5 0 0 1 .671.223l3 6a.5.5 0 0 1 0 .448l-3 6a.5.5 0 1 1-.894-.448L9.44 8 6.553 2.224a.5.5 0 0 1 .223-.671"/>
                </svg>
            </a>
        </li>
    }

    <!-- Última página -->
    <li class="page-item">
        <a class="page-link" [routerLink]="[url + '/'+ (paginator.page.totalPages - 1)+'/size/'+size]">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" 
                 class="bi bi-chevron-double-right" viewBox="0 0 16 16">
              <path fill-rule="evenodd" d="M3.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L9.293 8 3.646 2.354a.5.5 0 0 1 0-.708"/>
              <path fill-rule="evenodd" d="M7.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L13.293 8 7.646 2.354a.5.5 0 0 1 0-.708"/>
            </svg>
        </a>
    </li>

</ul>
}
